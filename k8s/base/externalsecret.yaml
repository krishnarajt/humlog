apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: humlog-env
  namespace: humlog
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: humlog-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Vault key holding the env for this app. The full list, with what each
        # one is for, is in .env.example. Expected keys:
        #   DATABASE_URL, SECRET_KEY, CORS_ORIGINS, PUBLIC_BASE_URL,
        #   MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
        #   MINIO_BUCKET, MINIO_REGION,
        #   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD,
        #   SMTP_FROM, SMTP_FROM_NAME,
        #   USE_ALEMBIC_MIGRATIONS, LOG_LEVEL
        #
        # The SMTP_* keys are optional: without SMTP_USER and SMTP_PASSWORD the
        # app runs normally and only password resets stop working — silently
        # from the outside, which is why the startup log complains about it.
        # PUBLIC_BASE_URL is what exported posts build their image URLs from.
        key: apps/humlog/humlog/env
