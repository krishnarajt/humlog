name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/overlays/github/kustomization.yaml"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/humlog:git-${{ github.sha }}

      - name: Update GitHub Kubernetes overlay
        run: |
          sed -i \
            's/newTag: .*/newTag: git-${{ github.sha }}/' \
            k8s/overlays/github/kustomization.yaml

      - name: Commit Kubernetes manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/overlays/github/kustomization.yaml
          git commit -m "chore(deploy): github git-${{ github.sha }}"
          git push
